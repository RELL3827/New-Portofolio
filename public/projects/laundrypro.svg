<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="lp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040b16" />
      <stop offset="100%" stop-color="#0b172a" />
    </linearGradient>
    <linearGradient id="lp-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#lp-bg)" stroke="rgba(56,189,248,0.2)" stroke-width="2"/>

  <!-- Top Navigation -->
  <rect x="0" y="0" width="800" height="60" rx="16" fill="#081020" />
  <rect x="0" y="44" width="800" height="16" fill="#081020" />
  <line x1="0" y1="60" x2="800" y2="60" stroke="rgba(255,255,255,0.05)" />

  <text x="30" y="36" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold">Laundry<tspan fill="#ffffff">Pro</tspan></text>
  
  <rect x="660" y="16" width="110" height="28" rx="14" fill="#132442" />
  <text x="715" y="34" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Admin Outlet A</text>

  <!-- Main Layout -->
  
  <!-- Left Side: Sidebar / Quick Actions -->
  <g transform="translate(30, 90)">
    <rect width="180" height="380" rx="12" fill="#0b1426" stroke="rgba(255,255,255,0.05)" />
    
    <rect x="15" y="15" width="150" height="36" rx="8" fill="url(#lp-accent)" />
    <text x="90" y="38" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">+ Pesanan Baru</text>

    <!-- Menu Items -->
    <text x="45" y="90" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="500">Dashboard</text>
    <rect x="15" y="72" width="4" height="24" rx="2" fill="#38bdf8" />

    <text x="45" y="130" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="500">Daftar Order</text>
    <text x="45" y="170" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="500">Pelanggan</text>
    <text x="45" y="210" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="500">Laporan Omzet</text>
    <text x="45" y="250" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="500">Pengaturan</text>
  </g>

  <!-- Right Side: Dashboard Content -->
  <g transform="translate(240, 90)">
    <!-- Metrics Cards -->
    <rect x="0" y="0" width="160" height="90" rx="10" fill="#0b1426" stroke="rgba(255,255,255,0.05)" />
    <text x="15" y="30" fill="#94a3b8" font-family="sans-serif" font-size="12">Omzet Hari Ini</text>
    <text x="15" y="60" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">Rp 840.000</text>
    <text x="15" y="78" fill="#34d399" font-family="sans-serif" font-size="11">+12% dari kemarin</text>

    <rect x="180" y="0" width="160" height="90" rx="10" fill="#0b1426" stroke="rgba(255,255,255,0.05)" />
    <text x="195" y="30" fill="#94a3b8" font-family="sans-serif" font-size="12">Cucian Aktif</text>
    <text x="195" y="60" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">28 Antrean</text>
    <text x="195" y="78" fill="#fbbf24" font-family="sans-serif" font-size="11">5 Perlu disetrika</text>

    <rect x="360" y="0" width="160" height="90" rx="10" fill="#0b1426" stroke="rgba(255,255,255,0.05)" />
    <text x="375" y="30" fill="#94a3b8" font-family="sans-serif" font-size="12">Selesai (Siap Ambil)</text>
    <text x="375" y="60" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold">12 Nota</text>
    <text x="375" y="78" fill="#94a3b8" font-family="sans-serif" font-size="11">Notif WA terkirim</text>

    <!-- Order Table -->
    <rect x="0" y="110" width="520" height="270" rx="10" fill="#0b1426" stroke="rgba(255,255,255,0.05)" />
    <text x="20" y="145" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">Antrean Cucian Terbaru</text>
    <line x1="0" y1="165" x2="520" y2="165" stroke="rgba(255,255,255,0.05)" />

    <text x="20" y="185" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="bold">ID ORDER</text>
    <text x="110" y="185" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="bold">PELANGGAN</text>
    <text x="260" y="185" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="bold">LAYANAN</text>
    <text x="390" y="185" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="bold">STATUS</text>

    <!-- Row 1 -->
    <text x="20" y="220" fill="#38bdf8" font-family="sans-serif" font-size="12">#LDR-0081</text>
    <text x="110" y="220" fill="#e2e8f0" font-family="sans-serif" font-size="12">Budi Santoso</text>
    <text x="260" y="220" fill="#94a3b8" font-family="sans-serif" font-size="12">Cuci Setrika Kiloan</text>
    <rect x="390" y="206" width="65" height="20" rx="10" fill="#3b82f6" fill-opacity="0.2" />
    <text x="422" y="220" fill="#60a5fa" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="bold">Dicuci</text>

    <!-- Row 2 -->
    <text x="20" y="260" fill="#38bdf8" font-family="sans-serif" font-size="12">#LDR-0082</text>
    <text x="110" y="260" fill="#e2e8f0" font-family="sans-serif" font-size="12">Rina Mulyati</text>
    <text x="260" y="260" fill="#94a3b8" font-family="sans-serif" font-size="12">Bed Cover Besar</text>
    <rect x="390" y="246" width="75" height="20" rx="10" fill="#f59e0b" fill-opacity="0.2" />
    <text x="427" y="260" fill="#fbbf24" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="bold">Disetrika</text>

    <!-- Row 3 -->
    <text x="20" y="300" fill="#38bdf8" font-family="sans-serif" font-size="12">#LDR-0083</text>
    <text x="110" y="300" fill="#e2e8f0" font-family="sans-serif" font-size="12">Andi Wijaya</text>
    <text x="260" y="300" fill="#94a3b8" font-family="sans-serif" font-size="12">Cuci Sepatu Sneaker</text>
    <rect x="390" y="286" width="65" height="20" rx="10" fill="#10b981" fill-opacity="0.2" />
    <text x="422" y="300" fill="#34d399" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="bold">Selesai</text>

    <!-- Row 4 -->
    <text x="20" y="340" fill="#38bdf8" font-family="sans-serif" font-size="12">#LDR-0084</text>
    <text x="110" y="340" fill="#e2e8f0" font-family="sans-serif" font-size="12">Citra Kirana</text>
    <text x="260" y="340" fill="#94a3b8" font-family="sans-serif" font-size="12">Cuci Kering Saja</text>
    <rect x="390" y="326" width="65" height="20" rx="10" fill="#8b5cf6" fill-opacity="0.2" />
    <text x="422" y="340" fill="#a78bfa" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="bold">Menunggu</text>
  </g>
</svg>
