<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="beauty-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#0a0e1c" />
    </linearGradient>

    <linearGradient id="rose-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b26871" />
      <stop offset="100%" stop-color="#e8b4b8" />
    </linearGradient>

    <linearGradient id="teal-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>

    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cfa859" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <linearGradient id="scan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0" />
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="face-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8b4b8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.05" />
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="glow-rose" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-teal" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Scan Pattern Grid -->
    <pattern id="grid-pattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(45, 212, 191, 0.07)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Frame Background with subtle rose/teal border -->
  <rect width="800" height="500" rx="16" fill="url(#beauty-bg)" stroke="rgba(232, 180, 184, 0.3)" stroke-width="2"/>

  <!-- Top App Navigation Bar -->
  <rect x="0" y="0" width="800" height="48" rx="16" fill="#0b1120" />
  <rect x="0" y="32" width="800" height="16" fill="#0b1120" />
  <line x1="0" y1="48" x2="800" y2="48" stroke="rgba(255, 255, 255, 0.08)" />

  <!-- Window controls -->
  <circle cx="28" cy="24" r="5" fill="#ef4444" opacity="0.85"/>
  <circle cx="46" cy="24" r="5" fill="#f59e0b" opacity="0.85"/>
  <circle cx="64" cy="24" r="5" fill="#10b981" opacity="0.85"/>

  <!-- App Title & URL Bar -->
  <g transform="translate(400, 24)">
    <rect x="-180" y="-12" width="360" height="24" rx="12" fill="#070c18" stroke="rgba(255, 255, 255, 0.07)" />
    <text x="0" y="4" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle" font-weight="500">
      <tspan fill="#e8b4b8">https://</tspan>skinsq.beauty.ai/skin-scanner/live-diagnostics
    </text>
  </g>

  <!-- Live Status Badge Top-Right -->
  <g transform="translate(710, 16)">
    <rect width="72" height="20" rx="10" fill="rgba(13, 148, 136, 0.2)" stroke="rgba(45, 212, 191, 0.4)" />
    <circle cx="10" cy="10" r="3.5" fill="#2dd4bf" />
    <text x="40" y="14" fill="#2dd4bf" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="700">AI ACTIVE</text>
  </g>

  <!-- ================= LEFT COLUMN: AI FACE SCANNER (450px) ================= -->
  <g transform="translate(20, 64)">
    <!-- Scanner Card Container -->
    <rect width="450" height="416" rx="14" fill="#09101f" stroke="rgba(45, 212, 191, 0.2)" stroke-width="1.5"/>

    <!-- Biometric Tech Background Grid -->
    <rect x="2" y="2" width="446" height="412" rx="12" fill="url(#grid-pattern)" />

    <!-- Ambient glow inside scanner -->
    <circle cx="225" cy="200" r="140" fill="#b26871" opacity="0.08" filter="url(#glow-rose)"/>
    <circle cx="225" cy="200" r="100" fill="#0d9488" opacity="0.09" filter="url(#glow-teal)"/>

    <!-- Scanner Top HUD Overlay -->
    <g transform="translate(16, 16)">
      <rect width="180" height="24" rx="12" fill="rgba(7, 12, 24, 0.8)" stroke="rgba(255, 255, 255, 0.1)"/>
      <circle cx="12" cy="12" r="3" fill="#2dd4bf"/>
      <text x="96" y="16" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Mesh Deteksi AI v3.8</text>
    </g>

    <g transform="translate(354, 16)">
      <rect width="80" height="24" rx="12" fill="rgba(7, 12, 24, 0.8)" stroke="rgba(232, 180, 184, 0.3)"/>
      <text x="40" y="16" fill="#e8b4b8" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">97.8% Conf.</text>
    </g>

    <!-- Corner Reticles / Frame Markers -->
    <path d="M 30 50 L 50 50 M 30 50 L 30 70" stroke="#2dd4bf" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M 420 50 L 400 50 M 420 50 L 420 70" stroke="#2dd4bf" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M 30 360 L 50 360 M 30 360 L 30 340" stroke="#2dd4bf" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M 420 360 L 400 360 M 420 360 L 420 340" stroke="#2dd4bf" stroke-width="2" fill="none" opacity="0.8"/>

    <!-- Stylized AI Face Silhouette & Wireframe Mesh -->
    <!-- Outer Face Oval Wireframe -->
    <ellipse cx="225" cy="195" rx="100" ry="130" fill="url(#face-glow)" stroke="rgba(232, 180, 184, 0.4)" stroke-width="1.5" stroke-dasharray="4 4" />
    <ellipse cx="225" cy="195" rx="75" ry="105" fill="none" stroke="rgba(45, 212, 191, 0.3)" stroke-width="1" />

    <!-- Stylized Facial Contour & Features -->
    <!-- Forehead & Eyebrows -->
    <path d="M 175 145 Q 195 138 210 145" stroke="#e8b4b8" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 240 145 Q 255 138 275 145" stroke="#e8b4b8" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Eyes contour -->
    <path d="M 178 160 Q 195 152 210 160 Q 195 168 178 160 Z" fill="rgba(232, 180, 184, 0.2)" stroke="#e8b4b8" stroke-width="1.2"/>
    <circle cx="194" cy="160" r="4" fill="#2dd4bf"/>
    <path d="M 240 160 Q 255 152 272 160 Q 255 168 240 160 Z" fill="rgba(232, 180, 184, 0.2)" stroke="#e8b4b8" stroke-width="1.2"/>
    <circle cx="256" cy="160" r="4" fill="#2dd4bf"/>

    <!-- Nose Bridge & Contour -->
    <path d="M 225 148 L 225 198 L 216 208 Q 225 212 234 208 L 225 198" stroke="rgba(45, 212, 191, 0.8)" stroke-width="1.5" fill="none"/>

    <!-- Lips & Smile Contour -->
    <path d="M 200 242 Q 225 236 250 242 Q 225 258 200 242 Z" fill="rgba(244, 63, 94, 0.3)" stroke="#e8b4b8" stroke-width="1.5"/>
    <!-- Chin Accent -->
    <path d="M 215 272 Q 225 277 235 272" stroke="#2dd4bf" stroke-width="1.5" fill="none"/>

    <!-- AI Facial Landmark Connectivity Mesh (MediaPipe-inspired) -->
    <g stroke="rgba(45, 212, 191, 0.35)" stroke-width="0.8">
      <!-- Forehead to Nose -->
      <line x1="225" y1="120" x2="195" y2="145" />
      <line x1="225" y1="120" x2="255" y2="145" />
      <line x1="225" y1="120" x2="225" y2="165" />
      <line x1="195" y1="145" x2="225" y2="165" />
      <line x1="255" y1="145" x2="225" y2="165" />
      <!-- Cheeks & Temples -->
      <line x1="150" y1="165" x2="178" y2="160" />
      <line x1="178" y1="160" x2="170" y2="210" />
      <line x1="170" y1="210" x2="216" y2="208" />
      <line x1="272" y1="160" x2="300" y2="165" />
      <line x1="272" y1="160" x2="280" y2="210" />
      <line x1="280" y1="210" x2="234" y2="208" />
      <!-- Mouth to Chin Mesh -->
      <line x1="216" y1="208" x2="200" y2="242" />
      <line x1="234" y1="208" x2="250" y2="242" />
      <line x1="200" y1="242" x2="225" y2="285" />
      <line x1="250" y1="242" x2="225" y2="285" />
      <line x1="170" y1="210" x2="190" y2="270" />
      <line x1="280" y1="210" x2="260" y2="270" />
      <line x1="190" y1="270" x2="225" y2="285" />
      <line x1="260" y1="270" x2="225" y2="285" />
    </g>

    <!-- Mesh Landmark Nodes -->
    <circle cx="225" cy="120" r="3" fill="#2dd4bf" />
    <circle cx="195" cy="145" r="2.5" fill="#2dd4bf" />
    <circle cx="255" cy="145" r="2.5" fill="#2dd4bf" />
    <circle cx="225" cy="165" r="3" fill="#2dd4bf" />
    <circle cx="170" cy="210" r="3" fill="#2dd4bf" />
    <circle cx="280" cy="210" r="3" fill="#2dd4bf" />
    <circle cx="225" cy="285" r="3" fill="#2dd4bf" />

    <!-- AI Laser Scan Line -->
    <g transform="translate(0, 185)">
      <rect x="25" y="0" width="400" height="2" fill="url(#scan-glow)" />
      <rect x="150" y="-1" width="150" height="4" fill="#2dd4bf" opacity="0.7" filter="url(#glow-teal)" />
    </g>

    <!-- Interactive Landmark Pin #1: T-Zone Sebum -->
    <g transform="translate(225, 125)">
      <circle cx="0" cy="0" r="8" fill="rgba(244, 63, 94, 0.25)" />
      <circle cx="0" cy="0" r="4" fill="#f43f5e" filter="url(#glow-rose)" />
      <!-- Tooltip -->
      <g transform="translate(14, -14)">
        <rect width="118" height="26" rx="6" fill="rgba(15, 23, 42, 0.95)" stroke="#f43f5e" stroke-width="1" />
        <text x="8" y="17" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="600">Minyak T-Zone 65%</text>
      </g>
    </g>

    <!-- Interactive Landmark Pin #2: Cheek Hydration -->
    <g transform="translate(160, 220)">
      <circle cx="0" cy="0" r="8" fill="rgba(13, 148, 136, 0.25)" />
      <circle cx="0" cy="0" r="4" fill="#2dd4bf" filter="url(#glow-teal)" />
      <!-- Tooltip -->
      <g transform="translate(-120, -14)">
        <rect width="112" height="26" rx="6" fill="rgba(15, 23, 42, 0.95)" stroke="#2dd4bf" stroke-width="1" />
        <text x="8" y="17" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="600">Hidrasi Pipi 72%</text>
      </g>
    </g>

    <!-- Interactive Landmark Pin #3: Skin Barrier -->
    <g transform="translate(285, 230)">
      <circle cx="0" cy="0" r="8" fill="rgba(207, 168, 89, 0.25)" />
      <circle cx="0" cy="0" r="4" fill="#cfa859" />
      <!-- Tooltip -->
      <g transform="translate(14, -14)">
        <rect width="105" height="26" rx="6" fill="rgba(15, 23, 42, 0.95)" stroke="#cfa859" stroke-width="1" />
        <text x="8" y="17" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="600">Skin Barrier: Kuat</text>
      </g>
    </g>

    <!-- Bottom Scanner HUD: Result Card -->
    <g transform="translate(16, 330)">
      <rect width="418" height="70" rx="12" fill="rgba(11, 18, 36, 0.92)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      
      <!-- Score Circle Badge -->
      <rect x="14" y="12" width="46" height="46" rx="12" fill="url(#rose-grad)" />
      <text x="37" y="40" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="800" text-anchor="middle">78</text>

      <!-- Score Description -->
      <text x="72" y="32" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Skor Kulit Baik (Optimal)</text>
      <text x="72" y="49" fill="#94a3b8" font-family="sans-serif" font-size="11">Tipe: Kulit Kombinasi • Area T Sebum Sedang</text>

      <!-- Optimal Status Tag -->
      <rect x="330" y="22" width="74" height="26" rx="13" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1" />
      <text x="367" y="39" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">✓ OPTIMAL</text>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: DIAGNOSTICS & RECOMMENDATIONS (300px) ================= -->
  <g transform="translate(482, 64)">
    <!-- CARD 1: Biomarkers Breakdown (135px) -->
    <rect width="298" height="130" rx="14" fill="#091020" stroke="rgba(255, 255, 255, 0.08)" />
    
    <g transform="translate(14, 14)">
      <!-- Header with sparkle icon -->
      <circle cx="10" cy="10" r="10" fill="rgba(232, 180, 184, 0.15)" />
      <text x="10" y="14" font-size="11" text-anchor="middle">✨</text>
      <text x="28" y="14" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">Analisis 9 Biomarkers</text>

      <!-- Metric 1: Hidrasi -->
      <g transform="translate(0, 26)">
        <text x="0" y="10" fill="#94a3b8" font-family="sans-serif" font-size="10">Kadar Hidrasi Kulit</text>
        <text x="270" y="10" fill="#2dd4bf" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="end">72% (Baik)</text>
        <rect x="0" y="15" width="270" height="5" rx="2.5" fill="#131e38" />
        <rect x="0" y="15" width="194" height="5" rx="2.5" fill="url(#teal-grad)" />
      </g>

      <!-- Metric 2: Sebum T-Zone -->
      <g transform="translate(0, 52)">
        <text x="0" y="10" fill="#94a3b8" font-family="sans-serif" font-size="10">Keseimbangan Sebum (Minyak)</text>
        <text x="270" y="10" fill="#e8b4b8" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="end">65% (Sedang)</text>
        <rect x="0" y="15" width="270" height="5" rx="2.5" fill="#131e38" />
        <rect x="0" y="15" width="175" height="5" rx="2.5" fill="url(#rose-grad)" />
      </g>

      <!-- Metric 3: Pori & Kerutan -->
      <g transform="translate(0, 78)">
        <text x="0" y="10" fill="#94a3b8" font-family="sans-serif" font-size="10">Kebersihan Pori &amp; Tekstur</text>
        <text x="270" y="10" fill="#facc15" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="end">88% (Bersih)</text>
        <rect x="0" y="15" width="270" height="5" rx="2.5" fill="#131e38" />
        <rect x="0" y="15" width="238" height="5" rx="2.5" fill="url(#gold-grad)" />
      </g>
    </g>

    <!-- CARD 2: Rekomendasi Skincare AI (145px) -->
    <g transform="translate(0, 142)">
      <rect width="298" height="142" rx="14" fill="#091020" stroke="rgba(232, 180, 184, 0.2)" />
      
      <g transform="translate(14, 14)">
        <circle cx="10" cy="10" r="10" fill="rgba(13, 148, 136, 0.15)" />
        <text x="10" y="14" font-size="11" text-anchor="middle">🧴</text>
        <text x="28" y="14" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">Rekomendasi Skincare Personal</text>
        
        <!-- Product Item 1: Serum -->
        <g transform="translate(0, 26)">
          <rect width="270" height="42" rx="8" fill="#0d162c" stroke="rgba(255, 255, 255, 0.05)" />
          <rect x="8" y="8" width="26" height="26" rx="6" fill="#162548" />
          <text x="21" y="25" font-size="14" text-anchor="middle">💧</text>
          <text x="42" y="20" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600">Niacinamide 10% + Zinc 1%</text>
          <text x="42" y="32" fill="#94a3b8" font-family="sans-serif" font-size="9">Kontrol Sebum • Perbaiki Pori</text>
          <rect x="206" y="12" width="56" height="18" rx="9" fill="rgba(232, 180, 184, 0.15)" />
          <text x="234" y="24" fill="#e8b4b8" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">PAGI/MALAM</text>
        </g>

        <!-- Product Item 2: Cleanser -->
        <g transform="translate(0, 74)">
          <rect width="270" height="42" rx="8" fill="#0d162c" stroke="rgba(255, 255, 255, 0.05)" />
          <rect x="8" y="8" width="26" height="26" rx="6" fill="#162548" />
          <text x="21" y="25" font-size="14" text-anchor="middle">🫧</text>
          <text x="42" y="20" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600">Gentle Ceramide Hydrating Wash</text>
          <text x="42" y="32" fill="#94a3b8" font-family="sans-serif" font-size="9">pH Seimbang • Pertahankan Barrier</text>
          <rect x="220" y="12" width="42" height="18" rx="9" fill="rgba(45, 212, 191, 0.15)" />
          <text x="241" y="24" fill="#2dd4bf" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">MATCH</text>
        </g>
      </g>
    </g>

    <!-- CARD 3: AI Beauty Consultant Chat & CTA (118px) -->
    <g transform="translate(0, 296)">
      <rect width="298" height="120" rx="14" fill="#091020" stroke="rgba(255, 255, 255, 0.08)" />

      <g transform="translate(14, 12)">
        <circle cx="10" cy="10" r="10" fill="rgba(207, 168, 89, 0.15)" />
        <text x="10" y="14" font-size="11" text-anchor="middle">💬</text>
        <text x="28" y="14" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">AI Konsultan Kecantikan</text>

        <!-- Chat Speech Bubble -->
        <g transform="translate(0, 24)">
          <rect width="270" height="44" rx="8" fill="#0d162c" stroke="rgba(232, 180, 184, 0.2)" />
          <text x="10" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="10">"Kulitmu membutuhkan hidrasi ringan</text>
          <text x="10" y="32" fill="#e8b4b8" font-family="sans-serif" font-size="10" font-weight="500">berbasis gel dan tabir surya SPF 50+."</text>
        </g>

        <!-- CTA Button -->
        <g transform="translate(0, 76)">
          <rect width="270" height="28" rx="8" fill="url(#rose-grad)" />
          <text x="135" y="18" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Mulai Konsultasi AI Real-Time →</text>
        </g>
      </g>
    </g>
  </g>
</svg>
