<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ft-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="100%" stop-color="#091122" />
    </linearGradient>
    <linearGradient id="ft-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2c67ed" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="ft-area" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c67ed" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#2c67ed" stop-opacity="0.0" />
    </linearGradient>
    <filter id="ft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="500" rx="16" fill="url(#ft-bg)" stroke="rgba(44, 103, 237, 0.25)" stroke-width="2"/>

  <!-- Top App Navigation Bar -->
  <rect x="0" y="0" width="800" height="48" rx="16" fill="#080e1d" />
  <rect x="0" y="32" width="800" height="16" fill="#080e1d" />
  <line x1="0" y1="48" x2="800" y2="48" stroke="rgba(255,255,255,0.08)" />

  <!-- Window controls -->
  <circle cx="28" cy="24" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="46" cy="24" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="64" cy="24" r="5" fill="#10b981" opacity="0.8"/>

  <text x="400" y="29" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="500">fintrack.app / dashboard / analytics</text>

  <!-- Sidebar -->
  <rect x="16" y="64" width="160" height="416" rx="12" fill="#0a1226" stroke="rgba(255,255,255,0.05)" />
  <rect x="32" y="84" width="24" height="24" rx="6" fill="#2c67ed" />
  <text x="39" y="100" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">F</text>
  <text x="64" y="101" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="600">FinTrack</text>

  <!-- Sidebar Nav items -->
  <rect x="24" y="130" width="144" height="34" rx="8" fill="#2c67ed" fill-opacity="0.15" stroke="rgba(44,103,237,0.3)" />
  <text x="40" y="152" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600">📊 Overview</text>
  <text x="40" y="192" fill="#64748b" font-family="sans-serif" font-size="12">💳 Wallets</text>
  <text x="40" y="232" fill="#64748b" font-family="sans-serif" font-size="12">📈 Analytics</text>
  <text x="40" y="272" fill="#64748b" font-family="sans-serif" font-size="12">⚙️ Settings</text>

  <!-- Main Content Area -->
  <!-- Header Stats Cards -->
  <g transform="translate(196, 64)">
    <!-- Card 1 -->
    <rect width="180" height="96" rx="12" fill="#0c1630" stroke="rgba(255,255,255,0.06)" />
    <text x="16" y="28" fill="#94a3b8" font-family="sans-serif" font-size="11">Total Balance</text>
    <text x="16" y="58" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">Rp 24.850.000</text>
    <rect x="16" y="70" width="56" height="16" rx="4" fill="#10b981" fill-opacity="0.15"/>
    <text x="22" y="82" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="600">+14.2% ↑</text>

    <!-- Card 2 -->
    <rect x="196" width="180" height="96" rx="12" fill="#0c1630" stroke="rgba(255,255,255,0.06)" />
    <text x="212" y="28" fill="#94a3b8" font-family="sans-serif" font-size="11">Monthly Expenses</text>
    <text x="212" y="58" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">Rp 4.320.000</text>
    <rect x="212" y="70" width="60" height="16" rx="4" fill="#ef4444" fill-opacity="0.15"/>
    <text x="218" y="82" fill="#f87171" font-family="sans-serif" font-size="10" font-weight="600">-3.8% ↓</text>

    <!-- Card 3 -->
    <rect x="392" width="192" height="96" rx="12" fill="#0c1630" stroke="rgba(44,103,237,0.25)" />
    <text x="408" y="28" fill="#38bdf8" font-family="sans-serif" font-size="11">Monthly Savings</text>
    <text x="408" y="58" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">Rp 8.120.000</text>
    <rect x="408" y="70" width="68" height="16" rx="4" fill="#2c67ed" fill-opacity="0.25"/>
    <text x="414" y="82" fill="#60a5fa" font-family="sans-serif" font-size="10" font-weight="600">Target 92%</text>
  </g>

  <!-- Big Graph Area -->
  <g transform="translate(196, 178)">
    <rect width="384" height="230" rx="12" fill="#0a1329" stroke="rgba(255,255,255,0.06)" />
    <text x="20" y="30" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="600">Cashflow Stream 2026</text>
    <text x="20" y="48" fill="#64748b" font-family="sans-serif" font-size="11">Automated Laravel + MySQL Aggregation</text>

    <!-- Grid lines -->
    <line x1="20" y1="80" x2="364" y2="80" stroke="rgba(255,255,255,0.04)" stroke-dasharray="4" />
    <line x1="20" y1="120" x2="364" y2="120" stroke="rgba(255,255,255,0.04)" stroke-dasharray="4" />
    <line x1="20" y1="160" x2="364" y2="160" stroke="rgba(255,255,255,0.04)" stroke-dasharray="4" />
    <line x1="20" y1="200" x2="364" y2="200" stroke="rgba(255,255,255,0.04)" />

    <!-- Chart Fill & Line -->
    <polygon points="30,195 70,170 120,150 170,165 220,110 270,125 320,85 360,70 360,200 30,200" fill="url(#ft-area)" />
    <polyline points="30,195 70,170 120,150 170,165 220,110 270,125 320,85 360,70" fill="none" stroke="url(#ft-blue)" stroke-width="3" filter="url(#ft-glow)" />

    <!-- Data points -->
    <circle cx="220" cy="110" r="5" fill="#38bdf8" stroke="#050811" stroke-width="2" />
    <circle cx="360" cy="70" r="5" fill="#38bdf8" stroke="#050811" stroke-width="2" />
  </g>

  <!-- Right Side Recent Transactions -->
  <g transform="translate(596, 178)">
    <rect width="188" height="230" rx="12" fill="#0a1329" stroke="rgba(255,255,255,0.06)" />
    <text x="16" y="30" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Transactions</text>

    <!-- Item 1 -->
    <g transform="translate(16, 50)">
      <circle cx="14" cy="14" r="14" fill="#2c67ed" fill-opacity="0.2" />
      <text x="10" y="19" fill="#38bdf8" font-size="12">💻</text>
      <text x="36" y="13" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="500">Cloud Host</text>
      <text x="36" y="25" fill="#64748b" font-family="sans-serif" font-size="9">14 Sep 2026</text>
      <text x="156" y="18" fill="#f87171" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="end">-Rp 150k</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(16, 95)">
      <circle cx="14" cy="14" r="14" fill="#10b981" fill-opacity="0.2" />
      <text x="10" y="19" fill="#34d399" font-size="12">💰</text>
      <text x="36" y="13" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="500">Freelance Web</text>
      <text x="36" y="25" fill="#64748b" font-family="sans-serif" font-size="9">12 Sep 2026</text>
      <text x="156" y="18" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="end">+Rp 2.5M</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(16, 140)">
      <circle cx="14" cy="14" r="14" fill="#f59e0b" fill-opacity="0.2" />
      <text x="10" y="19" fill="#fbbf24" font-size="12">☕</text>
      <text x="36" y="13" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="500">Coffee &amp; Work</text>
      <text x="36" y="25" fill="#64748b" font-family="sans-serif" font-size="9">10 Sep 2026</text>
      <text x="156" y="18" fill="#f87171" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="end">-Rp 45k</text>
    </g>

    <!-- Tech Stack Pill in Mockup -->
    <g transform="translate(16, 192)">
      <rect width="156" height="24" rx="6" fill="#2c67ed" fill-opacity="0.15" stroke="rgba(44,103,237,0.3)"/>
      <text x="78" y="16" fill="#38bdf8" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="500">Laravel 11 • Tailwind • MySQL</text>
    </g>
  </g>

  <!-- Bottom Mini Footer in Mockup -->
  <rect x="196" y="420" width="588" height="60" rx="10" fill="#080e1e" stroke="rgba(255,255,255,0.05)"/>
  <circle cx="218" cy="450" r="12" fill="#2c67ed" fill-opacity="0.2" />
  <text x="214" y="454" fill="#38bdf8" font-size="11">⚡</text>
  <text x="240" y="446" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="500">Realtime Financial Synchronization Engine</text>
  <text x="240" y="460" fill="#64748b" font-family="sans-serif" font-size="10">Secured with JWT authentication and automated daily backup.</text>
</svg>
