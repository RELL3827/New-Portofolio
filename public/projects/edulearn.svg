<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="el-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="100%" stop-color="#091227" />
    </linearGradient>
    <linearGradient id="el-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2c67ed" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect width="800" height="500" rx="16" fill="url(#el-bg)" stroke="rgba(44, 103, 237, 0.25)" stroke-width="2"/>

  <!-- App Bar -->
  <rect x="0" y="0" width="800" height="48" rx="16" fill="#080e1b" />
  <rect x="0" y="32" width="800" height="16" fill="#080e1b" />
  <line x1="0" y1="48" x2="800" y2="48" stroke="rgba(255,255,255,0.08)" />

  <circle cx="28" cy="24" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="46" cy="24" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="64" cy="24" r="5" fill="#10b981" opacity="0.8"/>

  <text x="400" y="29" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="500">edul-elearn.edu / courses / fullstack-web-architecture</text>

  <!-- Left: Video Lecture & Main Course Viewer (490px) -->
  <g transform="translate(20, 64)">
    <!-- Video Player Container -->
    <rect width="490" height="270" rx="12" fill="#0c1630" stroke="rgba(255,255,255,0.08)" />
    
    <!-- Video Content Simulation: Code Editor + Lecture -->
    <rect x="12" y="12" width="466" height="206" rx="8" fill="#060b17" />
    <circle cx="245" cy="115" r="28" fill="#2c67ed" fill-opacity="0.85" />
    <polygon points="240,103 258,115 240,127" fill="#ffffff" />

    <text x="24" y="36" fill="#38bdf8" font-family="monospace" font-size="12">// Module 04: RESTful API Integration &amp; Authentication</text>
    <text x="24" y="58" fill="#64748b" font-family="monospace" font-size="11">Route::post('/api/v1/auth/login', [AuthController::class, 'authenticate']);</text>
    <text x="24" y="78" fill="#64748b" font-family="monospace" font-size="11">$token = $user-&gt;createToken('portfolio-auth')-&gt;plainTextToken;</text>

    <!-- Video Scrubber Bar -->
    <g transform="translate(12, 230)">
      <line x1="0" y1="12" x2="466" y2="12" stroke="rgba(255,255,255,0.15)" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="12" x2="310" y2="12" stroke="#2c67ed" stroke-width="4" stroke-linecap="round"/>
      <circle cx="310" cy="12" r="6" fill="#38bdf8" />
      <text x="0" y="30" fill="#94a3b8" font-family="sans-serif" font-size="10">24:18 / 32:45</text>
      <text x="466" y="30" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="end">1080p HD • 1.25x</text>
    </g>

    <!-- Lecture Meta Details Below Video -->
    <g transform="translate(0, 288)">
      <text x="0" y="24" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Modern Web Engineering &amp; Architecture</text>
      <text x="0" y="44" fill="#94a3b8" font-family="sans-serif" font-size="12">Interactive LMS with auto-grading code submissions, live forums, and progress certificates.</text>

      <g transform="translate(0, 60)">
        <rect width="110" height="24" rx="12" fill="#2c67ed" fill-opacity="0.15" stroke="rgba(44,103,237,0.3)" />
        <text x="55" y="16" fill="#38bdf8" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="600">PHP 8.2 • MySQL</text>

        <rect x="120" width="90" height="24" rx="12" fill="#0f172a" stroke="rgba(255,255,255,0.1)" />
        <text x="165" y="16" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Bootstrap 5</text>

        <rect x="220" width="100" height="24" rx="12" fill="#10b981" fill-opacity="0.15" stroke="rgba(16,185,129,0.3)" />
        <text x="270" y="16" fill="#34d399" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="500">Active Course</text>
      </g>
    </g>
  </g>

  <!-- Right: Course Modules Curriculum & Progress (250px) -->
  <g transform="translate(530, 64)">
    <rect width="250" height="416" rx="12" fill="#0a1226" stroke="rgba(44,103,237,0.2)" />
    
    <!-- Progress Header -->
    <g transform="translate(18, 24)">
      <text x="0" y="14" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Course Curriculum</text>
      <text x="0" y="32" fill="#64748b" font-family="sans-serif" font-size="11">12 of 16 lessons completed (75%)</text>
      
      <rect y="44" width="214" height="6" rx="3" fill="#1e293b" />
      <rect y="44" width="160" height="6" rx="3" fill="url(#el-blue)" />
    </g>

    <!-- Modules List -->
    <g transform="translate(18, 100)">
      <!-- Item 1 (Done) -->
      <rect width="214" height="52" rx="8" fill="#0e1936" stroke="rgba(16,185,129,0.3)" />
      <circle cx="20" cy="26" r="9" fill="#10b981" fill-opacity="0.2" />
      <text x="20" y="30" fill="#34d399" font-size="10" text-anchor="middle">✓</text>
      <text x="38" y="22" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600">01. Web Fundamentals</text>
      <text x="38" y="37" fill="#64748b" font-family="sans-serif" font-size="10">HTML5, CSS3, DOM API • 45m</text>

      <!-- Item 2 (Done) -->
      <g transform="translate(0, 60)">
        <rect width="214" height="52" rx="8" fill="#0e1936" stroke="rgba(16,185,129,0.3)" />
        <circle cx="20" cy="26" r="9" fill="#10b981" fill-opacity="0.2" />
        <text x="20" y="30" fill="#34d399" font-size="10" text-anchor="middle">✓</text>
        <text x="38" y="22" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600">02. Backend Architecture</text>
        <text x="38" y="37" fill="#64748b" font-family="sans-serif" font-size="10">PHP OOP &amp; MVC Patterns • 1h 10m</text>
      </g>

      <!-- Item 3 (Current Active) -->
      <g transform="translate(0, 120)">
        <rect width="214" height="52" rx="8" fill="#122046" stroke="#2c67ed" stroke-width="1.5" />
        <circle cx="20" cy="26" r="9" fill="#2c67ed" />
        <polygon points="17,21 25,26 17,31" fill="#ffffff" />
        <text x="38" y="22" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">03. Database Optimization</text>
        <text x="38" y="37" fill="#94a3b8" font-family="sans-serif" font-size="10">MySQL Indexing &amp; Queries • 55m</text>
      </g>

      <!-- Item 4 (Locked / Next) -->
      <g transform="translate(0, 180)">
        <rect width="214" height="52" rx="8" fill="#0c142b" stroke="rgba(255,255,255,0.04)" />
        <circle cx="20" cy="26" r="9" fill="#1e293b" />
        <text x="20" y="30" fill="#64748b" font-size="10" text-anchor="middle">🔒</text>
        <text x="38" y="22" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="500">04. Authentication &amp; JWT</text>
        <text x="38" y="37" fill="#475569" font-family="sans-serif" font-size="10">Security Best Practices • 40m</text>
      </g>

      <!-- Item 5 (Final Project) -->
      <g transform="translate(0, 240)">
        <rect width="214" height="52" rx="8" fill="#0c142b" stroke="rgba(255,255,255,0.04)" />
        <circle cx="20" cy="26" r="9" fill="#1e293b" />
        <text x="20" y="30" fill="#64748b" font-size="10" text-anchor="middle">🏆</text>
        <text x="38" y="22" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="500">05. Capstone Project</text>
        <text x="38" y="37" fill="#475569" font-family="sans-serif" font-size="10">Live Production Deployment</text>
      </g>
    </g>
  </g>
</svg>
