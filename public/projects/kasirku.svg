<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="kk-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070f" />
      <stop offset="100%" stop-color="#0a1224" />
    </linearGradient>
    <linearGradient id="kk-btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2c67ed" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Window Frame -->
  <rect width="800" height="500" rx="16" fill="url(#kk-bg)" stroke="rgba(44, 103, 237, 0.25)" stroke-width="2"/>

  <!-- App Header -->
  <rect x="0" y="0" width="800" height="48" rx="16" fill="#080e1b" />
  <rect x="0" y="32" width="800" height="16" fill="#080e1b" />
  <line x1="0" y1="48" x2="800" y2="48" stroke="rgba(255,255,255,0.08)" />

  <circle cx="28" cy="24" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="46" cy="24" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="64" cy="24" r="5" fill="#10b981" opacity="0.8"/>

  <text x="400" y="29" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="500">kasirku.pos / terminal-01 / active-shift</text>

  <!-- Left Side: POS Product Catalog & Categories (510px) -->
  <g transform="translate(20, 64)">
    <!-- Top Bar with Search & Category Pills -->
    <rect width="480" height="40" rx="8" fill="#0b142b" stroke="rgba(255,255,255,0.08)" />
    <text x="16" y="25" fill="#64748b" font-family="sans-serif" font-size="12">🔍 Search barcode, SKU, or item...</text>

    <!-- Category Filter Chips -->
    <g transform="translate(0, 52)">
      <rect width="64" height="26" rx="13" fill="#2c67ed" />
      <text x="32" y="17" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="600">All (38)</text>

      <rect x="72" width="76" height="26" rx="13" fill="#0c1630" stroke="rgba(255,255,255,0.08)" />
      <text x="110" y="17" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Beverages</text>

      <rect x="156" width="60" height="26" rx="13" fill="#0c1630" stroke="rgba(255,255,255,0.08)" />
      <text x="186" y="17" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Food</text>

      <rect x="224" width="70" height="26" rx="13" fill="#0c1630" stroke="rgba(255,255,255,0.08)" />
      <text x="259" y="17" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Hardware</text>
    </g>

    <!-- Product Grid (2 columns x 3 rows) -->
    <!-- Product 1 -->
    <g transform="translate(0, 92)">
      <rect width="150" height="150" rx="10" fill="#0c1733" stroke="rgba(44,103,237,0.3)" />
      <rect x="10" y="10" width="130" height="80" rx="6" fill="#132347" />
      <text x="75" y="55" font-size="30" text-anchor="middle">☕</text>
      <text x="10" y="108" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">Kopi Susu Aren</text>
      <text x="10" y="126" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">Rp 18.000</text>
      <rect x="110" y="112" width="30" height="26" rx="6" fill="#2c67ed" />
      <text x="125" y="129" fill="#ffffff" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold">+</text>
    </g>

    <!-- Product 2 -->
    <g transform="translate(165, 92)">
      <rect width="150" height="150" rx="10" fill="#0c1733" stroke="rgba(255,255,255,0.06)" />
      <rect x="10" y="10" width="130" height="80" rx="6" fill="#132347" />
      <text x="75" y="55" font-size="30" text-anchor="middle">🥐</text>
      <text x="10" y="108" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">Butter Croissant</text>
      <text x="10" y="126" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">Rp 22.000</text>
      <rect x="110" y="112" width="30" height="26" rx="6" fill="#2c67ed" />
      <text x="125" y="129" fill="#ffffff" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold">+</text>
    </g>

    <!-- Product 3 -->
    <g transform="translate(330, 92)">
      <rect width="150" height="150" rx="10" fill="#0c1733" stroke="rgba(255,255,255,0.06)" />
      <rect x="10" y="10" width="130" height="80" rx="6" fill="#132347" />
      <text x="75" y="55" font-size="30" text-anchor="middle">🍵</text>
      <text x="10" y="108" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">Matcha Latte</text>
      <text x="10" y="126" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">Rp 24.000</text>
      <rect x="110" y="112" width="30" height="26" rx="6" fill="#2c67ed" />
      <text x="125" y="129" fill="#ffffff" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold">+</text>
    </g>

    <!-- Product 4 -->
    <g transform="translate(0, 256)">
      <rect width="150" height="150" rx="10" fill="#0c1733" stroke="rgba(255,255,255,0.06)" />
      <rect x="10" y="10" width="130" height="80" rx="6" fill="#132347" />
      <text x="75" y="55" font-size="30" text-anchor="middle">🍔</text>
      <text x="10" y="108" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">Cheeseburger</text>
      <text x="10" y="126" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">Rp 35.000</text>
      <rect x="110" y="112" width="30" height="26" rx="6" fill="#2c67ed" />
      <text x="125" y="129" fill="#ffffff" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold">+</text>
    </g>

    <!-- Product 5 -->
    <g transform="translate(165, 256)">
      <rect width="150" height="150" rx="10" fill="#0c1733" stroke="rgba(255,255,255,0.06)" />
      <rect x="10" y="10" width="130" height="80" rx="6" fill="#132347" />
      <text x="75" y="55" font-size="30" text-anchor="middle">🍟</text>
      <text x="10" y="108" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">Crispy Truffle Fries</text>
      <text x="10" y="126" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">Rp 20.000</text>
      <rect x="110" y="112" width="30" height="26" rx="6" fill="#2c67ed" />
      <text x="125" y="129" fill="#ffffff" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold">+</text>
    </g>

    <!-- Product 6 -->
    <g transform="translate(330, 256)">
      <rect width="150" height="150" rx="10" fill="#0c1733" stroke="rgba(255,255,255,0.06)" />
      <rect x="10" y="10" width="130" height="80" rx="6" fill="#132347" />
      <text x="75" y="55" font-size="30" text-anchor="middle">🍝</text>
      <text x="10" y="108" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">Spaghetti Carbonara</text>
      <text x="10" y="126" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">Rp 38.000</text>
      <rect x="110" y="112" width="30" height="26" rx="6" fill="#2c67ed" />
      <text x="125" y="129" fill="#ffffff" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold">+</text>
    </g>
  </g>

  <!-- Right Side: Order Cart & POS Checkout (260px) -->
  <g transform="translate(520, 64)">
    <rect width="260" height="416" rx="12" fill="#0a1226" stroke="rgba(44,103,237,0.3)" />

    <!-- Receipt Header -->
    <text x="20" y="32" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">Current Order #1042</text>
    <rect x="180" y="18" width="60" height="20" rx="4" fill="#10b981" fill-opacity="0.15" />
    <text x="210" y="32" fill="#34d399" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="bold">Dine In</text>

    <line x1="20" y1="48" x2="240" y2="48" stroke="rgba(255,255,255,0.06)" stroke-dasharray="4" />

    <!-- Cart Item 1 -->
    <g transform="translate(20, 64)">
      <text x="0" y="14" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="500">2x Kopi Susu Aren</text>
      <text x="0" y="28" fill="#64748b" font-family="sans-serif" font-size="10">Less Sugar, Oat milk</text>
      <text x="220" y="20" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="end">Rp 36.000</text>
    </g>

    <!-- Cart Item 2 -->
    <g transform="translate(20, 114)">
      <text x="0" y="14" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="500">1x Butter Croissant</text>
      <text x="0" y="28" fill="#64748b" font-family="sans-serif" font-size="10">Heated</text>
      <text x="220" y="20" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="end">Rp 22.000</text>
    </g>

    <!-- Cart Item 3 -->
    <g transform="translate(20, 164)">
      <text x="0" y="14" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="500">1x Crispy Truffle Fries</text>
      <text x="0" y="28" fill="#64748b" font-family="sans-serif" font-size="10">Extra Sauce</text>
      <text x="220" y="20" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="end">Rp 20.000</text>
    </g>

    <!-- Calculation Subtotal -->
    <g transform="translate(20, 230)">
      <line x1="0" y1="0" x2="220" y2="0" stroke="rgba(255,255,255,0.06)" />
      <text x="0" y="22" fill="#94a3b8" font-family="sans-serif" font-size="11">Subtotal</text>
      <text x="220" y="22" fill="#e2e8f0" font-family="sans-serif" font-size="11" text-anchor="end">Rp 78.000</text>

      <text x="0" y="42" fill="#94a3b8" font-family="sans-serif" font-size="11">Tax (PB1 10%)</text>
      <text x="220" y="42" fill="#e2e8f0" font-family="sans-serif" font-size="11" text-anchor="end">Rp 7.800</text>

      <line x1="0" y1="56" x2="220" y2="56" stroke="rgba(255,255,255,0.1)" stroke-dasharray="4" />
      <text x="0" y="80" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Total Amount</text>
      <text x="220" y="80" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="end">Rp 85.800</text>
    </g>

    <!-- Pay Button -->
    <g transform="translate(20, 344)">
      <rect width="220" height="48" rx="8" fill="url(#kk-btn)" />
      <text x="110" y="29" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Charge &amp; Print Receipt →</text>
    </g>
  </g>
</svg>
