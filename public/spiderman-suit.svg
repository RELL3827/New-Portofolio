<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <!-- Suit Gradients -->
    <radialGradient id="sm-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a0b12" />
      <stop offset="60%" stop-color="#07070f" />
      <stop offset="100%" stop-color="#020307" />
    </radialGradient>
    <radialGradient id="sm-mask" cx="50%" cy="32%" r="40%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="70%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#881337" />
    </radialGradient>
    <linearGradient id="sm-eye" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="75%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="sm-glow-eye" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="sm-sense-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Cosmic Background -->
  <rect width="600" height="800" fill="url(#sm-bg)"/>

  <!-- Web Texture Background -->
  <g stroke="rgba(239, 68, 68, 0.12)" stroke-width="1.2" fill="none">
    <circle cx="300" cy="270" r="80" />
    <circle cx="300" cy="270" r="150" />
    <circle cx="300" cy="270" r="230" />
    <circle cx="300" cy="270" r="320" />
    <circle cx="300" cy="270" r="420" />

    <line x1="300" y1="270" x2="300" y2="0" />
    <line x1="300" y1="270" x2="450" y2="20" />
    <line x1="300" y1="270" x2="580" y2="120" />
    <line x1="300" y1="270" x2="600" y2="270" />
    <line x1="300" y1="270" x2="550" y2="420" />
    <line x1="300" y1="270" x2="420" y2="550" />
    <line x1="300" y1="270" x2="180" y2="550" />
    <line x1="300" y1="270" x2="50" y2="420" />
    <line x1="300" y1="270" x2="0" y2="270" />
    <line x1="300" y1="270" x2="20" y2="120" />
    <line x1="300" y1="270" x2="150" y2="20" />
  </g>

  <!-- Spider-Sense Warning Waves (Pulsing Energy Arcs) -->
  <g stroke="#ef4444" stroke-width="3.5" stroke-linecap="round" fill="none" filter="url(#sm-sense-glow)">
    <!-- Top arcs -->
    <path d="M 240 100 Q 300 70 360 100" opacity="0.9" />
    <path d="M 210 70 Q 300 30 390 70" opacity="0.8" />
    <path d="M 180 40 Q 300 -5 420 40" opacity="0.7" />

    <!-- Left zigzags -->
    <path d="M 130 140 Q 160 180 140 220" opacity="0.85" />
    <path d="M 90 130 Q 120 180 100 230" opacity="0.75" />

    <!-- Right zigzags -->
    <path d="M 470 140 Q 440 180 460 220" opacity="0.85" />
    <path d="M 510 130 Q 480 180 500 230" opacity="0.75" />
  </g>

  <!-- Torso & Shoulders -->
  <path d="M 80 750 C 110 520 180 450 240 430 L 360 430 C 420 450 490 520 520 750 Z" fill="#0f172a" stroke="#2c67ed" stroke-width="2"/>
  <path d="M 170 750 C 190 540 230 460 300 450 C 370 460 410 540 430 750 Z" fill="#be123c" />

  <!-- High-Tech Spider Emblem on Chest -->
  <g transform="translate(300, 560)">
    <!-- Spider Body -->
    <ellipse cx="0" cy="0" rx="10" ry="24" fill="#030712" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="0" cy="-28" r="8" fill="#030712" stroke="#ffffff" stroke-width="1.5" />
    <!-- Spider Legs -->
    <g stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Upper legs -->
      <path d="M -8 -15 L -35 -40 L -60 -30" />
      <path d="M 8 -15 L 35 -40 L 60 -30" />
      <!-- Middle legs -->
      <path d="M -10 -5 L -45 -10 L -75 5" />
      <path d="M 10 -5 L 45 -10 L 75 5" />
      <!-- Lower-middle legs -->
      <path d="M -10 5 L -45 25 L -70 55" />
      <path d="M 10 5 L 45 25 L 70 55" />
      <!-- Bottom legs -->
      <path d="M -6 15 L -30 48 L -45 90" />
      <path d="M 6 15 L 30 48 L 45 90" />
    </g>
  </g>

  <!-- Neck -->
  <path d="M 235 380 L 235 440 L 365 440 L 365 380 Z" fill="#9f1239" />
  <line x1="300" y1="380" x2="300" y2="440" stroke="#000000" stroke-width="2" opacity="0.4"/>

  <!-- Head / Mask Base -->
  <ellipse cx="300" cy="270" rx="125" ry="165" fill="url(#sm-mask)" stroke="#000000" stroke-width="3" />

  <!-- Mask Webbing Patterns -->
  <!-- Radiating lines from bridge between eyes -->
  <g stroke="#030712" stroke-width="2.2" opacity="0.75">
    <line x1="300" y1="270" x2="300" y2="105" />
    <line x1="300" y1="270" x2="350" y2="115" />
    <line x1="300" y1="270" x2="395" y2="145" />
    <line x1="300" y1="270" x2="420" y2="195" />
    <line x1="300" y1="270" x2="425" y2="260" />
    <line x1="300" y1="270" x2="415" y2="330" />
    <line x1="300" y1="270" x2="385" y2="390" />
    <line x1="300" y1="270" x2="340" y2="425" />
    <line x1="300" y1="270" x2="300" y2="435" />

    <line x1="300" y1="270" x2="250" y2="115" />
    <line x1="300" y1="270" x2="205" y2="145" />
    <line x1="300" y1="270" x2="180" y2="195" />
    <line x1="300" y1="270" x2="175" y2="260" />
    <line x1="300" y1="270" x2="185" y2="330" />
    <line x1="300" y1="270" x2="215" y2="390" />
    <line x1="300" y1="270" x2="260" y2="425" />

    <!-- Web rings concentric -->
    <path d="M 230 200 Q 300 175 370 200" fill="none"/>
    <path d="M 205 160 Q 300 130 395 160" fill="none"/>
    <path d="M 240 330 Q 300 355 360 330" fill="none"/>
    <path d="M 260 380 Q 300 405 340 380" fill="none"/>
  </g>

  <!-- Left Eye Outer Frame (Black Bold Contour) -->
  <path d="M 285 240 C 270 215 235 205 195 215 C 190 260 210 320 278 300 C 285 270 286 255 285 240 Z" fill="#090d16" stroke="#000000" stroke-width="4" />
  <!-- Left Eye Glowing Lens -->
  <path d="M 278 245 C 265 226 238 218 206 226 C 202 260 220 305 272 290 C 277 268 278 256 278 245 Z" fill="url(#sm-eye)" filter="url(#sm-glow-eye)" />

  <!-- Right Eye Outer Frame (Black Bold Contour) -->
  <path d="M 315 240 C 330 215 365 205 405 215 C 410 260 390 320 322 300 C 315 270 314 255 315 240 Z" fill="#090d16" stroke="#000000" stroke-width="4" />
  <!-- Right Eye Glowing Lens -->
  <path d="M 322 245 C 335 226 362 218 394 226 C 398 260 380 305 328 290 C 323 268 322 256 322 245 Z" fill="url(#sm-eye)" filter="url(#sm-glow-eye)" />

  <!-- Nanotech Glint Accent on Eyes -->
  <circle cx="230" cy="245" r="4" fill="#ffffff" opacity="0.9" />
  <circle cx="370" cy="245" r="4" fill="#ffffff" opacity="0.9" />

  <!-- Atmospheric Cosmic Edge Rim Lighting -->
  <path d="M 180 200 C 170 240 170 290 185 340" stroke="#38bdf8" stroke-width="3.5" fill="none" opacity="0.6" />
  <path d="M 420 200 C 430 240 430 290 415 340" stroke="#ef4444" stroke-width="3.5" fill="none" opacity="0.6" />
</svg>
